<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password email</title>
  </head>

  <body>
    <p>Hello {{username}},</p>
    <p>
      You requested a password reset. Click the link below to reset your

    <hr />
    <p>Best regards,<br />Your Project Team</p>
  </body>
</html>
